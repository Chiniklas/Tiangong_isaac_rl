seed: -1

clip_observations: 5.0
clip_actions: 1.0

policy:
  pi_hid_sizes: [1024, 1024, 512, 512]
  vf_hid_sizes: [1024, 1024, 512, 512]
  activation: elu
  init_noise_std: 0.8

learn:
  agent_name: shadow_hand
  test: False
  resume: 0
  save_interval: 10000
  print_log: False
  max_iterations: 10000
  cliprange: 0.2
  ent_coef: 0.0
  nsteps: 8
  noptepochs: 5
  nminibatches: 4
  max_grad_norm: 1.0
  optim_stepsize: 0.0003
  schedule: adaptive
  desired_kl: 0.016
  gamma: 0.96
  lam: 0.95

